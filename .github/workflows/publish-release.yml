# Workflow to copy artifacts from the staging bucket to the release bucket when a new GitHub Release is published.

name: Publish Release
run-name: Publish ${{ github.ref_name }}
on:
    release:
        types: [published]
jobs:
    publish-s3:
        name: Publish to Releases
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        runs-on: ubuntu-latest
        env:
            PUBLISHER_KEY_ID: ${{ secrets.PUBLISHER_KEY_ID }}
            PUBLISHER_KEY_SECRET: ${{ secrets.PUBLISHER_KEY_SECRET }}
        steps:
            - uses: actions/checkout@v6
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish from staging
              if: env.PUBLISHER_KEY_ID != '' && env.PUBLISHER_KEY_SECRET != ''
              run: "task artifacts:publish:${{ github.ref_name }}"
              env:
                  AWS_ACCESS_KEY_ID: "${{ env.PUBLISHER_KEY_ID }}"
                  AWS_SECRET_ACCESS_KEY: "${{ env.PUBLISHER_KEY_SECRET }}"
                  AWS_DEFAULT_REGION: us-west-2
              shell: bash
    publish-snap-amd64:
        name: Publish AMD64 Snap
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        needs: [publish-s3]
        runs-on: ubuntu-latest
        env:
            SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN_CREDS }}
        steps:
            - uses: actions/checkout@v6
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Install Snapcraft
              if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
              run: sudo snap install snapcraft --classic
              shell: bash
            - name: Download Snap from Release
              if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
              uses: robinraju/release-downloader@v1
              with:
                  tag: ${{github.ref_name}}
                  fileName: "*amd64.snap"
            - name: Publish to Snapcraft
              if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
              run: "task artifacts:snap:publish:${{ github.ref_name }}"
              shell: bash
    publish-snap-arm64:
        name: Publish ARM64 Snap
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        needs: [publish-s3]
        runs-on: ubuntu-latest
        env:
            SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN_CREDS }}
        steps:
            - uses: actions/checkout@v6
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Install Snapcraft
              if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
              run: sudo snap install snapcraft --classic
              shell: bash
            - name: Download Snap from Release
              if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
              uses: robinraju/release-downloader@v1
              with:
                  tag: ${{github.ref_name}}
                  fileName: "*arm64.snap"
            - name: Publish to Snapcraft
              if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
              run: "task artifacts:snap:publish:${{ github.ref_name }}"
              shell: bash
    bump-winget:
        name: Submit WinGet PR
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'beta') }}
        needs: [publish-s3]
        runs-on: windows-latest
        env:
            WINGET_BUMP_PAT: ${{ secrets.WINGET_BUMP_PAT }}
        steps:
            - uses: actions/checkout@v6
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Install wingetcreate
              if: env.WINGET_BUMP_PAT != ''
              run: winget install -e --silent --accept-package-agreements --accept-source-agreements wingetcreate
              shell: pwsh
            - name: Submit WinGet version bump
              if: env.WINGET_BUMP_PAT != ''
              run: "task artifacts:winget:publish:${{ github.ref_name }}"
              env:
                  GITHUB_TOKEN: ${{ env.WINGET_BUMP_PAT }}
              shell: pwsh
