# Fork Release workflow - Builds and signs installers for macOS, Linux, and Windows,
# then attaches them to a GitHub Release on this fork. Unlike build-helper.yml this does
# not use the upstream S3 staging bucket; artifacts are published directly to the release.
#
# Required repository secrets:
#   macOS:   MACOS_CSC_LINK (base64 of Developer ID Application .p12), MACOS_CSC_KEY_PASSWORD,
#            APPLE_API_KEY_B64 (base64 of App Store Connect .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER
#   Windows: WIN_CSC_LINK (base64 of code-signing .pfx), WIN_CSC_KEY_PASSWORD
# Linux installers are not code-signed (normal for deb/rpm/AppImage).

name: Fork Release
run-name: Fork Release ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' - Manual' || '' }}
on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:
env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: 22
    NODE_OPTIONS: --max-old-space-size=4096
jobs:
    build-app:
        outputs:
            version: ${{ steps.set-version.outputs.WAVETERM_VERSION }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "darwin"
                      runner: "macos-latest"
                    - platform: "linux"
                      runner: "ubuntu-latest"
                    - platform: "linux"
                      runner: ubuntu-24.04-arm
                    - platform: "windows"
                      runner: "windows-latest"
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v6
            - name: Install Linux Build Dependencies (Linux only)
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libarchive-tools libopenjp2-tools rpm squashfs-tools
                  sudo snap install snapcraft --classic
                  sudo snap install lxd
                  sudo lxd init --auto
                  sudo snap refresh
            - name: Install Zig (not Mac)
              if: matrix.platform != 'darwin'
              uses: mlugg/setup-zig@v2

            # The version of FPM that comes bundled with electron-builder doesn't include a Linux ARM target.
            - name: Install FPM (not Windows)
              if: matrix.platform != 'windows'
              run: sudo gem install fpm
            - name: Install FPM (Windows only)
              if: matrix.platform == 'windows'
              run: gem install fpm

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{env.GO_VERSION}}
                  cache-dependency-path: |
                      go.sum
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: npm
                  cache-dependency-path: package-lock.json
            - name: Force git deps to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:
            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 5
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: "Set Version"
              id: set-version
              run: echo "WAVETERM_VERSION=$(task version)" >> "$GITHUB_OUTPUT"
              shell: bash

            # Build and package (with signing)
            - name: Build (Linux)
              if: matrix.platform == 'linux'
              run: task package
              env:
                  USE_SYSTEM_FPM: true
                  SNAPCRAFT_BUILD_ENVIRONMENT: host
            # Write the App Store Connect API key (.p8) to a file for notarytool
            - name: Prepare Apple API key (Darwin only)
              if: matrix.platform == 'darwin'
              run: |
                  echo "${{ secrets.APPLE_API_KEY_B64 }}" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
              shell: bash
            # Retry Darwin build in case of notarization failures
            - uses: nick-fields/retry@v4
              name: Build (Darwin)
              if: matrix.platform == 'darwin'
              with:
                  command: task package
                  timeout_minutes: 120
                  retry_on: error
                  max_attempts: 3
              env:
                  USE_SYSTEM_FPM: true
                  CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
                  APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
            - name: Build (Windows)
              if: matrix.platform == 'windows'
              run: task package
              env:
                  USE_SYSTEM_FPM: true
                  CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
              shell: powershell

            - name: Upload artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: ${{ matrix.runner }}
                  path: make
            - name: Upload Snapcraft logs on failure
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: ${{ matrix.runner }}-log
                  path: /home/runner/.local/state/snapcraft/log

    create-release:
        runs-on: ubuntu-latest
        needs: build-app
        permissions:
            contents: write
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: make
                  merge-multiple: true
            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: ${{ contains(github.ref_name, '-beta') }}
                  name: Wave Terminal ${{ github.ref_name }} (fork)
                  generate_release_notes: true
                  draft: false
                  files: |
                      make/*.zip
                      make/*.dmg
                      make/*.exe
                      make/*.msi
                      make/*.rpm
                      make/*.deb
                      make/*.pacman
                      make/*.snap
                      make/*.flatpak
                      make/*.AppImage
